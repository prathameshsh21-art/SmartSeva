server:
  port: 8080

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never


spring:
  application:
    name: smartseva-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartseva_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@666}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: SmartSevaPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

# ============================================================
# RESEND EMAIL API CONFIGURATION
# ============================================================
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:}


springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html


# ============================================================
# SMARTSEVA APPLICATION CONFIGURATION
# ============================================================

app:

  portal:
    base-url: ${PORTAL_BASE_URL:http://localhost:5173}

  notification:

    # --------------------------------------------------------
    # SMS (Device deep link)
    # --------------------------------------------------------
    sms:
      enabled: ${SMS_ENABLED:true}

    # --------------------------------------------------------
    # WHATSAPP (wa.me deep link)
    # --------------------------------------------------------
    whatsapp:
      enabled: ${WHATSAPP_ENABLED:true}

  # ----------------------------------------------------------
  # JWT
  # ----------------------------------------------------------
  jwt:
    secret: ${JWT_SECRET:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b_dev_only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  security:
    credential-encryption-key: ${APPLICATION_CREDENTIAL_ENCRYPTION_KEY:smartseva-default-dev-credential-key-32bytes!}

  # ----------------------------------------------------------
  # FILE STORAGE
  # ----------------------------------------------------------
  storage:
    local-dir: ./uploads


# ============================================================
# LOGGING
# ============================================================

logging:

  level:
    root: INFO
    com.smartseva: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

  file:
    name: logs/smartseva.log