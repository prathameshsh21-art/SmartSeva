server:
  port: 8080

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

spring:
  application:
    name: smartseva-backend

  datasource:
    url: jdbc:mysql://localhost:3306/smartseva_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root@666
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: SmartSevaPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: noreply.smartseva@gmail.com
    password: secret_pass
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  storage:
    local-dir: ./uploads

logging:
  level:
    root: INFO
    com.smartseva: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO

  file:
    name: logs/smartseva.log